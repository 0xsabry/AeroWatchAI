name: AeroWatch AI — Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Verify C2 Suite
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Syntax & Lint Inspection
        run: |
          # Stop the build if there are Python syntax errors or undefined names in core files
          flake8 app.py model_manager.py interceptor_sim.py video_interceptor_testbench.py camera_manager.py video_processor.py diagnostics.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Verify Neural Model Imports & Interceptor Sim
        run: |
          python -c "import interceptor_sim; import video_interceptor_testbench; import model_manager; print('ALL CORE MODULES IMPORTED SUCCESSFULLY')"

      - name: Run Test Suite
        run: |
          pytest tests/ -v -k "not test_physical_webcam"
