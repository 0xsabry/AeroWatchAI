<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="AeroWatchAI — AI-Powered Aerial Object Detection and Simulation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1D33"/>
      <stop offset="0.55" stop-color="#0A1729"/>
      <stop offset="1" stop-color="#071120"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 H0 V44" fill="none" stroke="#16324F" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect x="0" y="0" width="1280" height="4" fill="url(#ring)"/>

  <!-- sensor reticle artwork, right side -->
  <g transform="translate(990 320)" fill="none">
    <circle r="212" stroke="#14324E" stroke-width="1.5"/>
    <circle r="152" stroke="#14324E" stroke-width="1.5"/>
    <circle r="92" stroke="#14324E" stroke-width="1.5"/>
    <g stroke="url(#ring)" stroke-width="5" stroke-linecap="round">
      <path d="M0 -212 a212 212 0 0 1 150 62"/>
      <path d="M212 0 a212 212 0 0 1 -62 150"/>
      <path d="M0 212 a212 212 0 0 1 -150 -62"/>
      <path d="-212 0 a212 212 0 0 1 62 -150"/>
    </g>
    <g stroke="#2DD4BF" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-128" x2="0" y2="-104"/>
      <line x1="0" y1="104" x2="0" y2="128"/>
      <line x1="-128" y1="0" x2="-104" y2="0"/>
      <line x1="104" y1="0" x2="128" y2="0"/>
    </g>
    <!-- detection frame with corner brackets -->
    <g stroke="#22D3EE" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M-52 -66 h-14 v14"/>
      <path d="M52 -66 h14 v14" transform="scale(-1 1) translate(-104 0)"/>
      <path d="M-52 66 h-14 v-14"/>
      <path d="M52 66 h14 v-14" transform="scale(-1 1) translate(-104 0)"/>
    </g>
    <rect x="-13" y="-13" width="26" height="26" rx="3" transform="rotate(45)" fill="#22D3EE"/>
    <circle r="4.5" fill="#071120"/>
    <!-- secondary contacts -->
    <circle cx="-168" cy="-96" r="5" fill="#38BDF8" opacity="0.8"/>
    <circle cx="150" cy="128" r="5" fill="#2DD4BF" opacity="0.8"/>
    <circle cx="-120" cy="150" r="4" fill="#64748B" opacity="0.9"/>
  </g>

  <!-- logo mark, top-left -->
  <g transform="translate(72 64)">
    <rect x="0" y="0" width="72" height="72" rx="16" fill="#0D2137" stroke="#1E3A5F" stroke-width="1.5"/>
    <g fill="none" stroke="url(#ring)" stroke-width="3.4" stroke-linecap="round" transform="translate(36 36)">
      <path d="M0 -25 a25 25 0 0 1 17.7 7.3"/>
      <path d="M25 0 a25 25 0 0 1 -7.3 17.7"/>
      <path d="M0 25 a25 25 0 0 1 -17.7 -7.3"/>
      <path d="M-25 0 a25 25 0 0 1 7.3 -17.7"/>
    </g>
    <rect x="31" y="31" width="10" height="10" rx="1.6" transform="rotate(45 36 36)" fill="#22D3EE"/>
  </g>

  <!-- wordmark and message -->
  <text x="72" y="238" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="1" fill="#F1F5F9">AeroWatch<tspan fill="#22D3EE">AI</tspan></text>
  <text x="74" y="300" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="500" fill="#CBD5E1">AI-Powered Aerial Object Detection &amp; Simulation</text>
  <rect x="74" y="336" width="560" height="2" fill="#1E3A5F"/>
  <text x="74" y="392" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#94A3B8">A local-first computer-vision application for detecting,</text>
  <text x="74" y="428" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#94A3B8">explaining, and recording aerial objects — with a deterministic</text>
  <text x="74" y="464" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#94A3B8">safety layer and a clearly labelled simulation environment.</text>

  <!-- supporting message chips -->
  <g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#7DD3FC">
    <g>
      <rect x="74" y="508" width="212" height="44" rx="22" fill="#0D2137" stroke="#1E3A5F"/>
      <text x="180" y="537" text-anchor="middle">Computer Vision</text>
    </g>
    <g>
      <rect x="302" y="508" width="104" height="44" rx="22" fill="#0D2137" stroke="#1E3A5F"/>
      <text x="354" y="537" text-anchor="middle">YOLO</text>
    </g>
    <g>
      <rect x="422" y="508" width="238" height="44" rx="22" fill="#0D2137" stroke="#1E3A5F"/>
      <text x="541" y="537" text-anchor="middle">Detection Analytics</text>
    </g>
    <g>
      <rect x="676" y="508" width="212" height="44" rx="22" fill="#0D2137" stroke="#1E3A5F"/>
      <text x="782" y="537" text-anchor="middle">Local Processing</text>
    </g>
  </g>
</svg>
