    <line x1="32" y1="42" x2="32" y2="47"/>
    <line x1="17" y1="32" x2="22" y2="32"/>
    <line x1="42" y1="32" x2="47" y2="32"/>
  </g>
  <!-- detected object: small diamond at centre -->
  <rect x="27.5" y="27.5" width="9" height="9" rx="1.5" transform="rotate(45 32 32)" fill="#22D3EE"/>
